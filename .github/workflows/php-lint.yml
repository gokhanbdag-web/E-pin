name: PHP syntax checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  php-lint:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
      - name: Lint PHP source files
        run: |
          set -e
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)
      - name: Subdirectory and root routing smoke tests
        run: php tests/routing-smoke.php
      - name: Database migration contract tests
        run: php tests/migration-contract.php
      - name: Security contract tests
        run: php tests/security-contract.php
      - name: Database backup contract tests
        run: php tests/backup-contract.php
      - name: Payment callback contract tests
        run: php tests/payment-contract.php
      - name: MySQL migration integration tests
        env:
          EPIN_TEST_DB_HOST: 127.0.0.1
          EPIN_TEST_DB_PORT: 3306
          EPIN_TEST_DB_USER: root
          EPIN_TEST_DB_PASS: root
        run: php tests/migration-integration.php
